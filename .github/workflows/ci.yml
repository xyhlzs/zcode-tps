name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 插件只在 Windows 上运行（WinForms + user32），测试也只保证在 Windows 上通过
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 清单 JSON 可解析
        shell: pwsh
        run: |
          $files = @(
            'marketplace.json',
            'zcode-tps/.zcode-plugin/plugin.json',
            'zcode-tps/hooks/hooks.json'
          )
          foreach ($f in $files) {
            Get-Content -LiteralPath $f -Raw | ConvertFrom-Json | Out-Null
            Write-Host "OK  $f"
          }

      - name: 版本号在 marketplace 与 plugin.json 两处一致
        shell: pwsh
        run: |
          $m = (Get-Content -LiteralPath 'marketplace.json' -Raw | ConvertFrom-Json).plugins[0].version
          $p = (Get-Content -LiteralPath 'zcode-tps/.zcode-plugin/plugin.json' -Raw | ConvertFrom-Json).version
          if ($m -ne $p) {
            Write-Error "版本号不一致：marketplace.json=$m，plugin.json=$p（CHANGELOG.md 的发布清单要求同步递增）"
            exit 1
          }
          Write-Host "OK  version=$m"

      - name: .ps1 必须带 UTF-8 BOM
        shell: pwsh
        run: ./tools/check-bom.ps1

      - name: 标题 sidecar 语法可解析
        shell: pwsh
        run: |
          # 跟随回归测试跑在 -Headless 下，不启动 sidecar，所以这里单独守一道语法。
          node --check zcode-tps/monitor/tps-sidecar.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'OK  tps-sidecar.mjs'

      - name: sidecar 数据契约测试（合成库 + 真实子进程）
        shell: bash
        run: node zcode-tps/tests/sidecar-test.mjs

      - name: L3 估算与多会话并列数据层测试
        shell: pwsh
        run: ./zcode-tps/tests/estim-test.ps1

      - name: 会话跟随回归测试
        shell: pwsh
        run: ./zcode-tps/tests/follow-test.ps1

      - name: 主题解析测试（auto 跟随系统深浅色）
        shell: pwsh
        run: ./zcode-tps/tests/theme-test.ps1
